spring.application.name=site-backend
# spring.web.resources.static-locations=file:/home/comercio/site-frontend/ (Comentado porque es ruta de Linux, fallará en Windows)

# --- BASE DE DATOS (Ajusta si tu contraseña no es vacía) ---
spring.datasource.url=jdbc:mysql://localhost:3306/site_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
# Si usas XAMPP, la pass suele ser vacía. Si pusiste una, escríbela aquí:
spring.datasource.password=root

# --- JPA / HIBERNATE ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 'update' creará las tablas automáticamente si no existen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- ARCHIVOS (El error que te salía antes) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- JWT (Seguridad - Valores de prueba) ---
# Clave secreta larga random para que no falle al iniciar
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=3600000
jwt.refresh-expiration=86400000
jwt.cookie-name=jwt

# --- MAIL (Desactivado temporalmente para que no pida credenciales) ---
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# --- LOGGING ---
logging.level.org.springframework.security=INFO
spring.devtools.restart.enabled=true